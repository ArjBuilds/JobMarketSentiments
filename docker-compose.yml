# ClickHouse for the backend (docs/BACKEND.md). Local development only:
# the ports listen on 127.0.0.1 and the default user has no password.
#   docker compose up -d        then  BACKEND_STORE=clickhouse in .env
#   docker compose down -v      removes the data volume too
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: jmsa-clickhouse
    ports:
      - "127.0.0.1:8123:8123"   # HTTP, used by clickhouse-connect
    environment:
      CLICKHOUSE_DB: jmsa
      # Keep the image's default user as is (no password). Never expose this port.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clickhouse-data:
